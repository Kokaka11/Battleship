<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battleship</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>⚓ Battleship</h1>
    <div class="controls">
      <button id="newGame" class="primary">New game</button>
    </div>
  </header>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="boards">
    <section><h2>Enemy waters — click to fire</h2><div id="enemyGrid" class="grid enemy"></div><ul id="enemyFleet" class="fleet"></ul></section>
    <section><h2>Your fleet</h2><div id="playerGrid" class="grid"></div><ul id="playerFleet" class="fleet"></ul></section>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
